services:
  neo4j:
    restart: unless-stopped
    environment:
      # neo4j-admin server memory-recommendation --memory=12G --docker
      NEO4J_server_memory_heap_initial__size: '4600'
      NEO4J_server_memory_heap_max__size: '4600m'
      NEO4J_server_memory_pagecache_size: '4g'
      # It is also recommended turning out-of-memory errors into full crashes,
      # instead of allowing a partially crashed database to continue running:
      NEO4J_server_jvm_additional: "-XX:+ExitOnOutOfMemoryError"

  minio:
    restart: unless-stopped
    labels:
      - "traefik.http.routers.minio.rule=Host(`storage.grapheos.app`)"

  api:
    image: ghcr.io/oswatcher/graphql-api:latest
    restart: unless-stopped
    labels:
      - "traefik.http.routers.api.rule=Host(`api.grapheos.app`)"

  traefik:
    restart: unless-stopped
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=mathieu.tarral@protonmail.com"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      - "--providers.file.filename=/dynamic.yml"
    volumes:
      - "letsencrypt:/letsencrypt"
      - "./certs/prod.yml:/dynamic.yml"

volumes:
  letsencrypt:

# frontend is deployed on Github Pages
