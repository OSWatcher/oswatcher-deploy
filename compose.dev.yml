version: '3.8'

services:
  procedure-builder:
    build:
      context: ../grapheos-procedures
    volumes:
      - procedure_plugin:/plugin

  neo4j:
    depends_on:
      procedure-builder:
        condition: service_completed_successfully
    environment:
      NEO4J_apoc_export_file_enabled: "true"  # Enable APOC export to files
      NEO4J_db_logs_query_enabled: "VERBOSE"
      NEO4J_db_logs_query_parameter__logging__enabled: "true"
      NEO4J_db_logs_query_transaction_enabled: "VERBOSE"
  api:
    build:
      context: ../graphql-api
    environment:
      DEBUG: ${NEO4J_GRAPHQL_DEBUG_LVL}
    labels:
      - "traefik.http.routers.api.rule=Host(`api.localhost`)"

  traefik:
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true"
      - "--providers.file.filename=/dynamic.yml"
      - "--log.level=INFO"
    volumes:
      - "./certs/dev.yml:/dynamic.yml"
      - "./certs:/certs"

  frontend:
    depends_on:
      - api
    build:
      context: ../osw-frontend
      args:
        NODE_ENV: "development"
        GRAPHEOS_API_URI: "http://api"
        VITE_AUTH0_DOMAIN: ${VITE_AUTH0_DOMAIN}
        VITE_AUTH0_CLIENT_ID: ${VITE_AUTH0_CLIENT_ID}
        VITE_AUTH0_AUDIENCE: ${VITE_AUTH0_AUDIENCE}
    ports:
      - "5173:8080"
