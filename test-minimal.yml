services:
  neo4j-broken:
    image: neo4j:5.23
    environment:
      NEO4J_AUTH: none
      # This setting breaks neo4j stop
      NEO4J_server_directories_run: '/run'
    ports:
      - "7474:7474"
      - "7687:7687"
  
  neo4j-working:
    image: neo4j:5.23
    environment:
      NEO4J_AUTH: none
      # No special run directory - should work normally
    ports:
      - "7475:7474"
      - "7688:7687"