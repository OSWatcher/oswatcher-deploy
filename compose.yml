services:
  neo4j:
    image: neo4j:${NEO4J_VERSION}
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH}
      NEO4J_PLUGINS: '["apoc", "apoc-extended"]'
      # https://neo4j.com/docs/operations-manual/current/configuration/configuration-settings/#config_server.memory.heap.max_size
      # NEO4J_server_memory_heap_max__size: ${HEAP_MAXSIZE}
      # https://neo4j.com/docs/operations-manual/current/configuration/configuration-settings/#config_dbms.memory.transaction.total.max
      # 0: unlimited
      NEO4J_dbms_memory_transaction_total_max: 0
      # avoid 'neo4j is already running' issues
      # https://github.com/neo4j/neo4j/issues/12908#issuecomment-1643308694
      NEO4J_server_directories_run: '/run'
      # https://neo4j.com/docs/operations-manual/current/configuration/configuration-settings/#config_server.bolt.thread_pool_max_size
      # increase default thread pool size to avoid starvation
      NEO4J_server_bolt_thread__pool__max__size: 800
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 1m
      timeout: 10s
      retries: 3

  minio:
    image: minio/minio:${MINIO_VERSION}
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Web console
    volumes:
      - minio_data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio.entrypoints=websecure"
      - "traefik.http.routers.minio.tls.certresolver=myresolver"
      - "traefik.http.services.minio.loadbalancer.server.port=9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 1m
      timeout: 20s
      retries: 3

  api:
    depends_on:
      - neo4j
    ports:
      - "4000:4000"
    environment:
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_URI: "bolt://neo4j:7687"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=myresolver"
      - "traefik.http.services.api.loadbalancer.server.port=4000"

  traefik:
    depends_on:
      - api
      - minio
    image: traefik:v2.9
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      
volumes:
  neo4j_data:
  minio_data:
