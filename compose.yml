services:
  neo4j:
    image: neo4j:${NEO4J_VERSION}
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH}
      NEO4J_PLUGINS: '["apoc"]'
      # https://neo4j.com/docs/operations-manual/current/configuration/configuration-settings/#config_server.memory.heap.max_size
      # NEO4J_server_memory_heap_max__size: ${HEAP_MAXSIZE}
      # https://neo4j.com/docs/operations-manual/current/configuration/configuration-settings/#config_dbms.memory.transaction.total.max
      # 0: unlimited
      NEO4J_dbms_memory_transaction_total_max: 0
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 1m
      timeout: 10s
      retries: 3

  minio:
    image: minio/minio:${MINIO_VERSION}
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Web console
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 1m
      timeout: 20s
      retries: 3

  api:
    depends_on:
      - neo4j
    ports:
      - "4000:4000"
    environment:
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_URI: "bolt://neo4j:7687"


volumes:
  neo4j_data:
  minio_data:
