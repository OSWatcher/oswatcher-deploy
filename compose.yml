services:
  neo4j:
    image: neo4j:4.4.30
    environment:
      NEO4J_AUTH: none
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 1m
      timeout: 10s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2024-02-13T15-35-11Z
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Web console
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 1m
      timeout: 20s
      retries: 3

volumes:
  neo4j_data:
  minio_data:
